name: CI - Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Run Unit Tests
        run: dotnet test "PortalStudenta.Tests/PortalStudenta.Tests.csproj" --configuration Release --verbosity normal

      - name: Build MacCatalyst Target
        run: dotnet build "Portal Studenta/Portal Studenta.csproj" -f net10.0-maccatalyst -c Release -warnaserror -p:ValidateXcodeVersion=false
