<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>UniAvio - Portal Studenta</title>
    <base href="/" />

    <link rel="stylesheet" href="Portal Studenta.styles.css" />

    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/notes.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .app-initial-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            gap: 16px;
            box-sizing: border-box;
            text-align: center;
            padding: 24px;
        }
        .app-loader-icon {
            font-size: 3rem;
            line-height: 1;
        }
        .app-loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #0071e3;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }
        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }
        .app-loader-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .app-loader-subtitle {
            font-size: 0.85rem;
            color: #86868b;
            max-width: 280px;
        }
        .app-loader-reload {
            margin-top: 12px;
            padding: 10px 20px;
            border-radius: 9999px;
            background: #0071e3;
            color: #ffffff;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-initial-loader">
            <div class="app-loader-icon">🎓</div>
            <div class="app-loader-spinner"></div>
            <div class="app-loader-title">UniAvio</div>
            <div class="app-loader-subtitle" id="loader-status">Ładowanie portalu studenta...</div>
            <button id="loader-reload-btn" class="app-loader-reload" onclick="location.reload()">Odśwież stronę</button>
        </div>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="notes-editor.js"></script>

    <script>
        window.settingsManager = {
            applyLightMode: function (isLight) {
                try {
                    if (isLight === 'true') {
                        document.body.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                    }
                } catch (e) {
                    console.warn('[settingsManager] applyLightMode error:', e);
                }
            }
        };

        // Bezpieczne auto-ładowanie motywu przy starcie aplikacji z obsługą braku DOM storage
        try {
            var isLight = localStorage.getItem('app_lightmode');
            if (isLight === 'true') document.body.classList.add('light-mode');

            var hex = localStorage.getItem('app_hex');
            if (hex) document.documentElement.style.setProperty('--primary-color', hex);
        } catch (e) {
            console.warn('[index.html] localStorage access error:', e);
        }

        window.getCalendarFitHourHeight = function (totalHours) {
            try {
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var isMobile = (window.innerWidth || document.documentElement.clientWidth) < 768;
                // Na mobile odliczamy topbar (~48px), tabbar (~65px), weekbar (~36px), footer (~32px) i marginesy
                var overhead = isMobile ? 185 : 230;
                var avail = Math.max(260, vh - overhead);
                var perH = Math.floor(avail / Math.max(1, totalHours));
                return Math.max(34, Math.min(65, perH));
            } catch (e) {
                return 44;
            }
        };

        window.registerGlobalSearchShortcut = function (dotNetRef) {
            try {
                if (window._globalSearchHandler) {
                    window.removeEventListener('keydown', window._globalSearchHandler);
                }
                window._globalSearchHandler = function (e) {
                    if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('ToggleGlobalSearchFromJs');
                    }
                };
                window.addEventListener('keydown', window._globalSearchHandler);
            } catch (e) {
                console.warn('[registerGlobalSearchShortcut] error:', e);
            }
        };

        // Fallback w razie opóźnionego startu Blazor Hybrid
        setTimeout(function () {
            var btn = document.getElementById('loader-reload-btn');
            var status = document.getElementById('loader-status');
            if (btn && status && document.querySelector('.app-initial-loader')) {
                status.innerText = 'Uruchamianie trwa dłużej niż zwykle. Kliknij poniżej, aby ponowić próbę:';
                btn.style.display = 'inline-block';
            }
        }, 7000);
    </script>
</body>
</html>
